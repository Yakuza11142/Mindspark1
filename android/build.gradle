buildscript {
    ext.kotlin_version = '2.0.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    buildscript {
        repositories {
            google()
            mavenCentral()
        }
    }
}

rootProject.buildDir = "../build"

subprojects { project ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    if (project.name != "app") {
        project.evaluationDependsOn(":app")
    }

    project.tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:-unchecked" << "-Xlint:-deprecation"
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            freeCompilerArgs += ["-Xmx1024m"]
            jvmTarget = "17"
        }
    }

    project.plugins.withId('com.android.library') {
        if (project.android.hasProperty('compileSdkVersion')) {
            project.android.compileSdkVersion 34
        }

        if (project.android.namespace == null) {
            String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = "com.mindspark.generated.${cleanName}"
        }

        project.android.ext.architectureFixRun = false
        project.android.variantFilter { variant ->
            if (!project.android.ext.architectureFixRun) {
                try {
                    def manifestFile = project.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        String fileText = manifestFile.text
                        if (fileText.contains('package=')) {
                            manifestFile.text = fileText.replaceAll(/package="[^"]*"/, "")
                        }
                    }
                } catch (Exception e) {
                    logger.quiet("⚠️ Manifest patch skip for [${project.name}]: ${e.getMessage()}")
                }
                project.android.ext.architectureFixRun = true
            }
        }
    }

    project.plugins.withId('com.android.application') {
        if (project.android.namespace == null) {
            project.android.namespace = "com.mindspark.app"
        }
    }

    project.configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && !details.requested.name.startsWith('kotlinx-')) {
                details.useVersion '2.0.20'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
