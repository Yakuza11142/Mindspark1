buildscript {
    ext.kotlin_version = '2.0.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // 🚀 FIXED: Aggressively ensures mavenCentral is injected into background sub-buildscripts
    buildscript {
        repositories {
            google()
            mavenCentral()
        }
    }

    // 🚀 FIXED: Added precise strict filtering so it ONLY targets the compiler, not coroutine extensions
    configurations.all { configuration ->
        if (configuration.name.contains("detachedConfiguration") || configuration.name.contains("classpath")) {
            resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                // ONLY override if the group matches the core compiler engine exactly
                if (details.requested.group == 'org.jetbrains.kotlin' && !details.requested.name.startsWith('kotlinx-')) {
                    details.useVersion '2.0.20'
                }
            }
        }
    }
}

rootProject.buildDir = "../build"

// 🚀 FIXED: Patches the internal buildscript layer of arcore with safe repository gates before evaluation
gradle.beforeProject { project ->
    project.buildscript.repositories {
        google()
        mavenCentral()
    }
    
    if (project.name == "arcore_flutter_plugin") {
        project.buildscript.configurations.all {
            resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'org.jetbrains.kotlin' && !details.requested.name.startsWith('kotlinx-')) {
                    details.useVersion '2.0.20'
                }
            }
        }
    }
}

subprojects { project ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")

    // INTERCEPTS ALL LIBRARY MODULES SYNCHRONOUSLY
    project.plugins.withId('com.android.library') {
        if (project.android.namespace == null) {
            String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = "com.mindspark.generated.${cleanName}"
        }
        
        project.android.ext.architectureFixRun = false
        project.android.variantFilter { variant ->
            if (!project.android.ext.architectureFixRun) {
                try {
                    def manifestFile = project.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        String fileText = manifestFile.text
                        if (fileText.contains('package=')) {
                            manifestFile.text = fileText.replaceAll(/package="[^"]*"/, "")
                        }
                    }
                } catch (Exception e) {
                    logger.quiet("⚠️ Manifest patch skip for [${project.name}]: ${e.getMessage()}")
                }
                project.android.ext.architectureFixRun = true
            }
        }
    }
    
    project.plugins.withId('com.android.application') {
        if (project.android.namespace == null) {
            String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = "com.mindspark.app"
        }
    }

    // Hard-locks every standard library dependency configuration across the application layer to 2.0.20
    project.configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && !details.requested.name.startsWith('kotlinx-')) {
                details.useVersion '2.0.20'
            }
        }
    }

    // SELF-HEALING GHOST PLUGIN HANDLER: Cleans out deprecated v1 embedding definitions on the fly
    if (project.name == "cached_video_player") {
        tasks.withType(JavaCompile).configureEach { task ->
            task.options.compilerArgs << "-Xlint:-unchecked" << "-Xlint:-deprecation"
            task.doFirst {
                def brokenJavaFile = project.file("src/main/java/com/lazyarts/vikram/cached_video_player/CachedVideoPlayerPlugin.java")
                if (brokenJavaFile.exists()) {
                    String codeText = brokenJavaFile.text
                    if (codeText.contains("PluginRegistry.Registrar")) {
                        codeText = codeText.replaceAll(/public static void registerWith\([^}]*\s*\n*\s*\}/, "public static void registerWith(Object r) {}")
                        codeText = codeText.replaceAll(/private CachedVideoPlayerPlugin\([^}]*\s*\n*\s*\}/, "private CachedVideoPlayerPlugin(Object r) {}")
                        brokenJavaFile.text = codeText
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
