buildscript {
    ext.kotlin_version = '2.1.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.set(rootProject.file("../build"))

subprojects { project ->
    project.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(project.name))

    // Fix missing namespaces IMMEDIATELY as Android plugins are applied
    project.plugins.withId("com.android.library") {
        if (!project.android.hasProperty('namespace') || project.android.namespace == null) {
            String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = "com.mindspark.generated.${cleanName}"
        }
        project.android.compileSdkVersion 35
    }

    project.plugins.withId("com.android.application") {
        if (!project.android.hasProperty('namespace') || project.android.namespace == null) {
            project.android.namespace = "com.mindspark.app"
        }
        project.android.compileSdkVersion 35
    }

    project.tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:-unchecked" << "-Xlint:-deprecation"
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }

    // Force unified Kotlin dependency versions across transitive plugins
    project.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && !details.requested.name.startsWith('kotlinx-')) {
                details.useVersion '2.1.10'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
