buildscript {
    ext.kotlin_version = '2.1.10'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // MATCHING TOOLCHAINS: Gradle 8.9.1 pairs perfectly with Kotlin 2.1.x plugins
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.set(rootProject.file("../build"))

subprojects { project ->
    // Build directory configuration is mapped safely before subproject execution trees evaluate
    project.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(project.name))

    project.tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:-unchecked" << "-Xlint:-deprecation"
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }

    // FIXED: Safe property lookups configure child plugin extensions without throwing raw method exceptions
    project.plugins.configureEach { plugin ->
        if (plugin.class.name.contains("com.android.build.gradle.LibraryPlugin")) {
            project.extensions.configure("android") { ext ->
                ext.setCompileSdk(35)
                if (!ext.hasProperty('namespace') || ext.namespace == null) {
                    String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
                    ext.setNamespace("com.mindspark.generated.${cleanName}")
                }
            }
        }
        if (plugin.class.name.contains("com.android.build.gradle.AppPlugin")) {
            project.extensions.configure("android") { ext ->
                if (!ext.hasProperty('namespace') || ext.namespace == null) {
                    ext.setNamespace("com.mindspark.app")
                }
            }
        }
    }

    // Forces unified sub-dependency resolution parameters across all transitive plugin lines
    project.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && !details.requested.name.startsWith('kotlinx-')) {
                details.useVersion '2.1.10'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
