buildscript {
    ext.kotlin_version = '2.0.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects { project ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")

    // 🚀 INTERCEPTS MISSING NAMESPACES
    project.plugins.withId('com.android.library') {
        if (project.android.namespace == null) {
            String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = "com.mindspark.generated.${cleanName}"
        }
    }
    
    project.plugins.withId('com.android.application') {
        if (project.android.namespace == null) {
            String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = "com.mindspark.generated.${cleanName}"
        }
    }

    // 🚀 THE KOTLIN COMPILER FORCE-ENFORCER: Resolves the arcore_flutter_plugin 1.3.50 conflict instantly
    project.configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '2.0.20'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
