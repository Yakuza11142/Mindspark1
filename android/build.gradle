buildscript {
    ext.kotlin_version = '2.0.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects { project ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")

    // 🚀 FIXED: Dynamic immediate evaluation logic prevents afterEvaluate race conditions
    if (project.hasProperty('android')) {
        // Fallback safety to check both local properties and immediate values
        if (project.android.namespace == null) {
            String dynamicNamespace = "com.mindspark.generated." + project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = dynamicNamespace
            logger.quiet("🚀 Instantly assigned missing namespace for [${project.name}] -> [${dynamicNamespace}]")
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
