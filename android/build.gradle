buildscript {
    ext.kotlin_version = '2.0.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// 🚀 FIXED: Dynamic classpath interception overrides the 1.3.50 plugin crash before evaluation
gradle.beforeProject { project ->
    if (project.name == "arcore_flutter_plugin") {
        project.buildscript.configurations.all {
            resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion '2.0.20'
                }
            }
        }
    }
}

subprojects { project ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")

    // INTERCEPTS MISSING NAMESPACES SYNCHRONOUSLY
    project.plugins.withId('com.android.library') {
        if (project.android.namespace == null) {
            String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = "com.mindspark.generated.${cleanName}"
            logger.quiet("🚀 Assigned missing namespace for Library [${project.name}] -> [${project.android.namespace}]")
        }
    }
    
    project.plugins.withId('com.android.application') {
        if (project.android.namespace == null) {
            String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = "com.mindspark.generated.${cleanName}"
            logger.quiet("🚀 Assigned missing namespace for App [${project.name}] -> [${project.android.namespace}]")
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
