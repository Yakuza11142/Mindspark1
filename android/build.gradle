buildscript {
    ext.kotlin_version = '2.0.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects { project ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")

    // 🚀 THE UNIVERSAL MOBILE FIREWALL: Automatically fixes namespaces for ALL legacy background plugins at once!
    afterEvaluate {
        if (project.hasProperty('android')) {
            // Checks if a namespace is missing
            if (project.android.namespace == null) {
                // Dynamically creates a valid unique namespace string using the plugin's folder name
                String dynamicNamespace = "com.mindspark.generated." + project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
                project.android.namespace = dynamicNamespace
                logger.quiet("🚀 Fixed missing namespace for [${project.name}] -> mapped to [${dynamicNamespace}]")
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
