buildscript {
    ext.kotlin_version = '2.0.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// 🚀 FIXED: Upgraded classpath interception to force internal sub-buildscripts to compile with Kotlin 2.0.20
gradle.beforeProject { project ->
    if (project.name == "arcore_flutter_plugin") {
        project.buildscript.configurations.all {
            resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion '2.0.20'
                }
            }
        }
    }
}

subprojects { project ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")

    // INTERCEPTS MISSING NAMESPACES SYNCHRONOUSLY
    project.plugins.withId('com.android.library') {
        if (project.android.namespace == null) {
            String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = "com.mindspark.generated.${cleanName}"
        }
        
        // 🚀 THE ULTIMATE MANIFEST ATTRIBUTE STRIPPER: Removes the forbidden package="..." string natively
        project.android.ext.architectureFixRun = false
        project.android.variantFilter { variant ->
            if (!project.android.ext.architectureFixRun) {
                try {
                    // Locates the manifest file path directly within the plugin's source tree
                    def manifestFile = project.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        String fileText = manifestFile.text
                        // Removes the target package attribute while keeping the manifest tag perfectly valid
                        if (fileText.contains('package=')) {
                            manifestFile.text = fileText.replaceAll(/package="[^"]*"/, "")
                            logger.quiet("🚀 Hard-purged deprecated XML package attribute natively from: [${project.name}]")
                        }
                    }
                } catch (Exception e) {
                    logger.quiet("⚠️ Manifest patch skip for [${project.name}]: ${e.getMessage()}")
                }
                project.android.ext.architectureFixRun = true
            }
        }
    }
    
    project.plugins.withId('com.android.application') {
        if (project.android.namespace == null) {
            String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = "com.mindspark.generated.${cleanName}"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
