buildscript {
    ext.kotlin_version = '2.0.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

// 🚀 FIXED: Upgraded classpath interception to force internal sub-buildscripts to compile with Kotlin 2.0.20
gradle.beforeProject { project ->
    if (project.name == "arcore_flutter_plugin") {
        project.buildscript.configurations.all {
            resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion '2.0.20'
                }
            }
        }
    }
}

subprojects { project ->
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")

    // INTERCEPTS MISSING NAMESPACES SYNCHRONOUSLY
    project.plugins.withId('com.android.library') {
        if (project.android.namespace == null) {
            String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = "com.mindspark.generated.${cleanName}"
        }
        
        // 🚀 THE NATIVE MANIFEST FIX: Dynamically forces AGP to overwrite and ignore old manifest package attributes
        project.android.defaultConfig {
            manifestPlaceholders = [package: project.android.namespace]
        }
        
        // Forcefully strips the old attribute from the manifest compiler inputs task array entirely
        project.tasks.withType(com.android.build.gradle.tasks.ProcessLibraryManifest.class).configureEach { task ->
            task.doFirst {
                if (task.manifestOutputFile.get().asFile.exists()) {
                    String content = task.manifestOutputFile.get().asFile.text
                    task.manifestOutputFile.get().asFile.text = content.replaceAll(/package="com\.difrancescogianmarco\.arcore_flutter_plugin"/, "")
                }
            }
        }
    }
    
    project.plugins.withId('com.android.application') {
        if (project.android.namespace == null) {
            String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
            project.android.namespace = "com.mindspark.generated.${cleanName}"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
