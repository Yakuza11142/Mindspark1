pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File(settingsDir, "local.properties")

        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream {
                properties.load(it)
            }
        }

        def flutterSdk = properties.getProperty("flutter.sdk")
        if (flutterSdk == null) {
            flutterSdk = System.getenv("FLUTTER_ROOT")
        }

        if (flutterSdk == null) {
            throw new GradleException("Flutter SDK not found. Set flutter.sdk in local.properties.")
        }

        return flutterSdk
    }()

    // Maps the native Gradle plugins directly out of your local framework setup dynamically
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // FIXED: Removed the hardcoded version strings to let the internal includeBuild inject the matching runtime version
    id "dev.flutter.flutter-plugin-loader"
    id "dev.flutter.flutter-gradle-plugin" apply false
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.10" apply false
}

dependencyResolutionManagement {
    // FIXED: Centralizes package downloads, protecting your 80+ dependencies from repository desyncs
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "mindspark1"
include ":app"
