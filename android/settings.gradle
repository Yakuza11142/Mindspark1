pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File(settingsDir, "local.properties")

        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream {
                properties.load(it)
            }
        }

        def flutterSdk = properties.getProperty("flutter.sdk")
        if (flutterSdk == null) {
            flutterSdk = System.getenv("FLUTTER_ROOT")
        }

        if (flutterSdk == null) {
            throw new GradleException("Flutter SDK not found. Set flutter.sdk in local.properties.")
        }

        return flutterSdk
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.10" apply false
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "mindspark1"
include ":app"
