plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.mindspark.app"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // FIXED: Enforces standard native Flutter Android plugin architecture paths
    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // FIXED: Securely pulls properties, fallback triggers ONLY if file reference is completely broken
            storeFile file(System.getenv("SIGNING_STORE_FILE") ?: 'release.keystore')
            storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: 'android'
            keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: 'androiddebugkey'
            keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: 'android'
        }
    }

    defaultConfig {
        applicationId "com.mindspark.app"
        minSdk 24 // Required baseline for complex WebRTC and MLKit processing
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        
        // CRITICAL FIX: Required to support multiple heavy AI/AR plugins without exceeding dex method limits
        multiDexEnabled true 
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            // FIXED: Dynamically matches signing configs reliably by reading the explicit build type namespace
            signingConfig signingConfigs.release

            minifyEnabled true
            shrinkResources true
            
            // FIXED: Added essential optimization consumer rules alongside the primary proguard configuration array
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
