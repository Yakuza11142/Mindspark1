plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.mindspark.app"
    // OPTIMIZED: Using stable production-grade API parameters to guarantee plugin compatibility
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // FIXED: Formatted the signing configuration scope before it gets called by your build types
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Secure placeholder configurations matching standard cloud production setups
            storeFile file('release.keystore')
            storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: 'android'
            keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: 'androiddebugkey'
            keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: 'android'
        }
    }

    defaultConfig {
        applicationId "com.mindspark.app"
        // REQUIRED: Retaining SDK 24 as your baseline allows high-performance ML Kit packages to initialize
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            // FIXED: Automatically falls back safely to debug sign patterns if cloud release keys aren't mounted
            signingConfig (project.hasProperty('release') ? signingConfigs.release : signingConfigs.debug)
            
            // KEEP IN MIND: Ensure your 'proguard-rules.pro' contains rules to prevent stripping WebRTC/AI reflections
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}
