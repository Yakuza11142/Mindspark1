plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // Unique identifier matching your settings and manifest namespaces
    namespace "com.mindspark.app"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // FIXED: Centralizes both folder hierarchies explicitly to protect your mixed source tree
    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            kotlin.srcDirs = ['src/kotlin']
        }
    }

    // FIXED: Structured signing configurations to satisfy automated production builds
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Pulls secure credentials from environment variables when running on CI
            storeFile file('release.keystore')
            storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: 'android'
            keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: 'androiddebugkey'
            keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: 'android'
        }
    }

    defaultConfig {
        applicationId "com.mindspark.app"
        // Required API 24 baseline allows advanced WebRTC and ML Kit dependencies to initialize
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            // Automatically falls back to debug signing signatures if release secrets aren't mounted
            signingConfig (project.hasProperty('release') ? signingConfigs.release : signingConfigs.debug)
            
            // Optimizes final file sizes while honoring your custom proguard-rules.pro overrides
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}
