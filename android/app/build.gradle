plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    // 🚀 FIXED: Fully satisfies the compile headers expected by your modern plugins
    compileSdk 36

    namespace "com.mindspark.app"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // 🚀 FIXED: Automatically binds your live workflow keystore signatures to your production builds
    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.mindspark.app"
        minSdk 24
        // 🚀 FIXED: Pairs perfectly with your compileSdk to legalize hardware intent pipelines
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // 🚀 FIXED: Breaks past the 65k method cap so your 1,276 file project can build safely
        multiDexEnabled true
    }

    buildTypes {
        release {
            // 🚀 FIXED: Ensures Google Play Protect accepts your app instead of forcing a runtime crash
            signingConfig signingConfigs.release
            
            // Handles aggressive code-stripping optimizations for production
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Native MultiDex engine library
    implementation 'androidx.multidex:multidex:2.0.1'
}
