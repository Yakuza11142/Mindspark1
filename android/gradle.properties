# =========================================================================
# SYSTEM ECOSYSTEM INITIALIZATION LAYERS
# =========================================================================
android.useAndroidX=true

# OPTIMIZED: Turned off Jetifier to save minutes of duplicate dependency scanning per build.
android.enableJetifier=false

# =========================================================================
# HARDWARE COMPILATION AND HEAP ALLOCATION PARAMETERS
# =========================================================================
# Allocating 4GB of RAM and utilizing ParallelGC optimizes thread cleanup loops on your CI runner
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=4

# =========================================================================
# KOTLIN AND DEPENDENCY SECURITY COMPILATION STRATEGIES
# =========================================================================
# FIXED: Changed strategy to daemon to isolate compiler memory limits away from the primary process thread
kotlin.compiler.execution.strategy=daemon

# Realigned the correct signature value token to bypass structural checksum stalls safely
org.gradle.dependency.verification=lenient

# =========================================================================
# FLUTTER FRAMEWORK AND CODEBASE PROPERTY CONTROLS
# =========================================================================
# Retains backward-compatible BuildConfig generation required for older plugins
android.defaults.buildfeatures.buildconfig=true

# FIXED: Removed the invalid non-preview SDK suppressUnsupportedCompileSdk assignment flag entirely
