# Allocate 4GB of RAM to the compiler and use modern Parallel Garbage Collection
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Enable modern AndroidX libraries
android.useAndroidX=true

# DISABLED: Jetifier is obsolete and slows down builds for modern AGP 8+ environments
android.enableJetifier=false

# Performance enhancements for faster build cycles
org.gradle.caching=true
org.gradle.parallel=true

# Keep daemon active (true) to ensure consecutive 'flutter run' commands compile instantly
org.gradle.daemon=true

# Optimizes resource namespaces for clean compilation profiles
android.nonTransitiveRClass=true

kotlin.code.style=official
