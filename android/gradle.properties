# 🚀 MEMORY PROTECTION GATEWAY: Prevents the JVM garbage collector from thrashing on the runner
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=1
android.enableR8.fullMode=false

# 🚀 THE NATIVE LOCKOUT: Completely shuts down the buggy snapshot verification loops
systemProp.org.gradle.internal.kotlin.build.tools.api.enabled=false
android.experimental.runCompileKotlinAsTask=true
kotlin.compiler.execution.strategy=in-process
org.gradle.dependency.verification=off
