# 🚀 CORE ANDROIDX ENGINE: Resolves the extractReleaseAnnotations crash instantly
android.useAndroidX=true
android.enableJetifier=true

# 🚀 MEMORY PROTECTION ENGINE: Keeps JVM memory footprint stable on the runner
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=1
android.enableR8.fullMode=false

# 🚀 TRANSFORMATION OVERRIDES: Disables experimental background compilation APIs
systemProp.org.gradle.internal.kotlin.build.tools.api.enabled=false
android.experimental.runCompileKotlinAsTask=true
kotlin.compiler.execution.strategy=in-process
org.gradle.dependency.verification=off
