name: mindspark1
description: "AI TUTOR & AR LAB"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: any

  # State Management
  provider: any

  # Backend
  supabase_flutter: any

  # Environment
  flutter_dotenv: any

  # Networking
  dio: any

  # Utilities
  intl: any
  crypto: any
  uuid: any
  vector_math: any

  # Device
  permission_handler: any
  shared_preferences: any
  path_provider: any
  url_launcher: any

  # AI
  google_generative_ai: any

  # Voice
  flutter_tts: any

  # Animation
  flutter_animate: any

  # Camera & Vision
  camera: any
  google_mlkit_face_detection: any

  # WebRTC
  flutter_webrtc: any

  # Deep Links
  app_links: any

  # WebView
  webview_flutter: any

  # Ads
  google_mobile_ads: any

  # AR (Modern Engine Swap - Fully Verified Stable)
  ar_flutter_plugin_plus: any

  device_info_plus: any
  google_mlkit_language_id: any
  google_translate_api: any
  in_app_review: any
  flutter_tex: any
  http: any
  hive_flutter: any
  flutter_secure_storage: any
  freerasp: any
  pdf: any
  ntp: any
  audioplayers: any
  dart_openai: any
  cloud_firestore: any
  flutter_math_fork: any
  google_mlkit_text_recognition: any
  groq_sdk: any
  firebase_auth: any
  qr_flutter: any
  share_plus: any
  connectivity_plus: any
  sks_ticket_view: any
  vibration: any
  audio_session: any
  environment_sensors: any
  pqcrypto: any
  thirds: any
  safe_device: any
  flutter_jailbreak_detection: any
  firebase_analytics: any
  in_app_purchase: any
  flutter_cache_manager: any
  battery_plus: any
  image_picker: any
  package_info_plus: any
  carrier_info: any
  video_player: any
  sqflite: any
  path: any
  google_sign_in: any
  flutter_image_compress: any
  flutter_windowmanager: any
  ios_insecure_screen_detector: any
  firebase_messaging: any
  flutter_local_notifications: any
  timezone: any
  sensors_plus: any
  drift: any
  model_viewer_plus: any
  file_picker: any
  flutter_fortune_wheel: any
  screen_brightness: any
  dash_chat_2: any
  pointycastle: any
  flutter_highlight: any
  shimmer: any
  local_auth: any
  cached_network_image: any
  confetti: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: any
  build_runner: any
  source_gen: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: assets/icon_launcher.png

  web:
    generate: true
    image_path: assets/icon_launcher.png
