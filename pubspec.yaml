name: mindspark1
description: "AI TUTOR & AR LAB"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Backend & Core Databases
  supabase_flutter: ^2.8.1
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+2
  drift: ^2.20.0

  # Environment & Utilities
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  crypto: ^3.0.5
  uuid: ^4.5.1
  vector_math: ^2.1.4
  path: ^1.9.0
  path_provider: ^2.1.4
  timezone: ^0.9.4

  # Networking
  dio: ^5.7.0
  http: ^1.2.2
  connectivity_plus: ^6.1.0

  # Device Hardware & Permissions
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  device_info_plus: ^10.1.2
  battery_plus: ^6.1.0
  sensors_plus: ^6.1.1
  environment_sensors: ^2.0.1
  vibration: ^1.9.0
  screen_brightness: ^1.1.0
  carrier_info: ^3.0.1

  # AI & Large Language Models
  google_generative_ai: ^0.4.6
  groq_sdk: ^0.1.2
  dart_openai: ^5.1.0

  # Voice & Audio
  flutter_tts: ^4.1.1
  audioplayers: ^6.1.0
  audio_session: ^0.1.21

  # Animation & UI Components
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  confetti: ^0.7.0
  flutter_fortune_wheel: ^3.1.2
  sks_ticket_view: ^0.0.3
  dash_chat_2: ^0.0.21

  # Camera, Vision, & Media
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  google_mlkit_language_id: ^0.12.0
  google_mlkit_text_recognition: ^0.13.0
  google_translate_api: ^0.0.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  video_player: ^2.9.2
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1

  # WebRTC & Deep Links
  flutter_webrtc: ^0.12.4
  app_links: ^6.0.1
  webview_flutter: ^4.9.0

  # Monetization & Reviews
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.2.0
  in_app_review: ^2.0.9

  # AR (Modern Engine Swap Stack)
  ar_flutter_plugin_plus: ^0.3.0
  model_viewer_plus: ^1.8.0

  # Math & Document Rendering
  flutter_tex: ^4.1.2
  flutter_math_fork: ^0.7.2
  pdf: ^3.11.1
  qr_flutter: ^4.1.0
  flutter_highlight: ^0.7.0

  # Enterprise Security & Integrity
  freerasp: ^6.5.0
  safe_device: ^1.1.4
  flutter_jailbreak_detection: ^1.2.0
  flutter_secure_storage: ^9.2.2
  flutter_windowmanager: ^0.2.0
  ios_insecure_screen_detector: ^0.1.1
  local_auth: ^2.3.0
  ntp: ^2.0.1
  pqcrypto: ^0.0.3
  pointycastle: ^3.9.1
  thirds: ^0.1.4

  # Sharing & Packages
  share_plus: ^10.1.0
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  source_gen: ^1.5.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: assets/icon_launcher.png

  web:
    generate: true
    image_path: assets/icon_launcher.png
