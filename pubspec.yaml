name: mindspark1
description: "AI TUTOR & AR LAB"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # CLOUD BACKEND
  supabase_flutter: ^2.16.0

  # APPLICATION STATE & UTILITIES
  provider: ^6.1.5+1
  flutter_dotenv: ^6.0.1
  intl: ^0.20.3
  crypto: ^3.0.7
  uuid: ^4.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  share_plus: ^10.1.4

  # LOCAL CACHING / DATABASE
  hive_flutter: ^1.1.0
  sqflite: ^2.4.3
  sqflite_common_ffi_web: ^1.1.2
  drift: ^2.22.1

  # CORE INFRASTRUCTURE
  dio: ^5.11.0
  http: ^1.6.0
  connectivity_plus: ^6.1.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  device_info_plus: ^11.1.1
  battery_plus: ^6.2.1
  vibration: ^2.0.1
  screen_brightness: ^2.1.11
  app_links: ^6.3.2
  ntp: ^2.0.0
  timezone: ^0.9.4

  # SENSORS / MATH
  sensors_plus: ^6.1.0
  environment_sensors: ^0.3.0
  vector_math: ^2.1.4

  # AI / ML
  google_generative_ai: ^0.4.7
  groq_sdk: ^1.0.2
  dart_openai: ^5.1.0
  google_mlkit_commons: ^0.10.0
  google_mlkit_face_detection: ^0.12.0
  google_mlkit_language_id: ^0.12.0
  google_mlkit_text_recognition: ^0.14.0

  # CAMERA / VIDEO / AUDIO
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_image_compress: ^2.3.0
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  flutter_webrtc: ^0.12.5
  webview_flutter: ^4.10.0
  flutter_tts: ^4.2.2
  just_audio: ^0.9.42
  audio_session: ^0.1.21

  # MONETIZATION
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.2.0
  in_app_review: ^2.0.9

  # 3D / AR / MATH
  model_viewer_plus: ^1.7.0
  flutter_tex: ^5.2.7
  flutter_math_fork: ^0.7.3

  # UI
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  confetti: ^0.8.0
  flutter_fortune_wheel: ^1.3.2
  dash_chat_2: ^0.0.21
  sks_ticket_view: ^1.0.0
  pdf: ^3.11.1
  qr_flutter: ^4.1.0
  flutter_highlight: ^0.7.0

  # SECURITY
  freerasp: ^6.4.0
  flutter_secure_storage: ^9.2.2
  flutter_windowmanager: ^0.2.0
  ios_insecure_screen_detector: ^0.0.2
  local_auth: ^2.3.0
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  source_gen: ^1.5.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/shaders/
    - assets/intro.mp4
    - .env

  shaders:
    - assets/shaders/hologram_glow.frag

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon_launcher.png"
  web:
    generate: true
    image_path: "assets/icon_launcher.png"
