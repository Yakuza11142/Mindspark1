name: mindspark1
description: "AI TUTOR & AR LAB Environment Core Framework built exclusively on Supabase."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ===========================================================================
  # CLOUD BACKEND (Supabase Core - No Firebase)
  # ===========================================================================
  supabase_flutter: ^2.8.1

  # ===========================================================================
  # APPLICATION STATE & COMPILATION UTILITIES
  # ===========================================================================
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  path: ^1.9.1
  path_provider: ^2.1.5
  package_info_plus: ^8.1.2
  share_plus: ^10.1.3

  # ===========================================================================
  # RELATIONAL LOCAL CACHING ENGINE (With Full Browser Support)
  # ===========================================================================
  hive_flutter: ^1.1.0
  sqflite: ^2.4.1
  sqflite_common_ffi_web: ^0.4.3+1
  drift: ^2.24.0

  # ===========================================================================
  # OPERATING SYSTEM CHANNELS & CORE INFRASTRUCTURE
  # ===========================================================================
  dio: ^5.7.0
  http: ^1.2.2
  connectivity_plus: ^6.1.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  device_info_plus: ^11.1.2
  battery_plus: ^6.1.2
  vibration: ^2.0.1
  screen_brightness: ^1.1.0
  carrier_info: ^3.1.0
  app_links: ^6.3.2
  ntp: ^2.0.0
  timezone: ^0.9.4

  # ===========================================================================
  # PHYSICS SENSORS & RIGID GEOMETRIC MATH MATRIX
  # ===========================================================================
  sensors_plus: ^6.1.1
  environment_sensors: ^2.0.0
  vector_math: ^2.1.4

  # ===========================================================================
  # ON-DEVICE VISION INTELLIGENCE & LLM UTILITIES (With Web Bridges Included)
  # ===========================================================================
  google_generative_ai: ^0.4.9
  groq_sdk: ^0.2.5
  dart_openai: ^5.2.0
  google_mlkit_commons: ^0.8.0
  google_mlkit_face_detection: ^0.11.0
  google_mlkit_language_id: ^0.11.0
  google_mlkit_text_recognition: ^0.11.0

  # ===========================================================================
  # CAPTURE DEVICES, WEBRTC VIDEO STREAMS & MEDIA ENGINES
  # ===========================================================================
  camera: ^0.11.1
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_image_compress: ^2.3.0
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  flutter_webrtc: ^0.12.5
  webview_flutter: ^4.9.0
  flutter_tts: ^4.1.1
  audioplayers: ^6.1.1
  audio_session: ^0.1.21

  # ===========================================================================
  # APPS ADVERTISING MONETIZATION & DIGITAL REVENUE
  # ===========================================================================
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.2.0
  in_app_review: ^2.0.9

  # ===========================================================================
  # 3D MODEL VIEWERS & EMBEDDED ADVANCED MATHEMATICS
  # ===========================================================================
  ar_flutter_plugin_plus: ^1.1.3
  model_viewer_plus: ^1.8.0
  flutter_tex: ^4.1.3
  flutter_math_fork: ^0.7.2

  # ===========================================================================
  # INTERACTIVE PREMIUM USER INTERFACE LAYOUT WRAPPERS
  # ===========================================================================
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  confetti: ^0.7.0
  flutter_fortune_wheel: ^1.3.1
  dash_chat_2: ^0.0.21
  sks_ticket_view: ^1.0.0
  pdf: ^3.14.1
  qr_flutter: ^4.1.0
  flutter_highlight: ^0.7.0

  # ===========================================================================
  # RUNTIME APP ATTESTATION & CIPHER ENCRYPTION SHIELDS
  # ===========================================================================
  freerasp: ^6.5.0
  flutter_secure_storage: ^9.2.2
  flutter_windowmanager: ^0.2.0
  ios_insecure_screen_detector: ^0.0.2
  local_auth: ^2.3.0
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.14
  source_gen: ^1.5.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  meta: ^1.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon_launcher.png"
  web:
    generate: true
    image_path: "assets/icon_launcher.png"
