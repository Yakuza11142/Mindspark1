name: MindSpark Production CI
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mindspark-production
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          validate-wrappers: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Sandbox Template Factory Execution
        run: |
          mkdir -p ../vault/
          cp -r lib assets web pubspec.yaml ../vault/ 2>/dev/null || true
          
          if [ -d "android" ]; then
            mkdir -p ../vault/android/
            find android/ -name "*.keystore" -exec cp {} ../vault/android/ \; 2>/dev/null || true
            find android/ -name "*.properties" -exec cp {} ../vault/android/ \; 2>/dev/null || true
          fi
          
          rm -rf * .[^.]*
          
          flutter create --org com.mindspark --project-name mindspark1 .
          rm -rf lib/ assets/ web/ pubspec.yaml
          
          cp -r ../vault/lib ./lib
          cp -r ../vault/assets ./assets
          cp -r ../vault/web ./web
          
          cat > pubspec.yaml <<'EOF'
          name: mindspark1
          description: "MindSpark Production Application Engine"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            intl: any
            meta: any
            collection: any
            crypto: any
            path: any
            permission_handler: any
            ar_flutter_plugin_plus: any
            web: any
            provider: any
            flutter_dotenv: any
            supabase_flutter: any
            google_mobile_ads: any
            video_player: any
          dev_dependencies:
            flutter_lints: any
          flutter:
            uses-material-design: true
            assets:
              - assets/
              - assets/.env
              - assets/icon_launcher.png
              - assets/intro.mp4
            shaders:
              - assets/shaders/hologram_glow.frag
          EOF
          
          if [ ! -f "web/index.html" ]; then
            mkdir -p web
            echo '<!DOCTYPE html><html><head><base href="$FLUTTER_BASE_HREF"><meta charset="UTF-8"><title>Mind Spark</title><script src="flutter_bootstrap.js" async></script></head><body></body></html>' > web/index.html
          fi
          
          if [ -d "../vault/android" ]; then
            cp ../vault/android/*.keystore android/app/ 2>/dev/null || cp ../vault/android/*.keystore android/ 2>/dev/null || true
          fi
          
          # 🌟 ABSOLUTE DEEP-CLEAN INTERCEPTOR
          # Scans every single file in the workspace (.yaml, .dart, everything) and scrubs any corrupt 'pqc' lines instantly
          find . -type f -exec sed -i '/pqc/d' {} + || true
          
          dart fix --apply && dart format lib/ || true
          
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            flutter_test:
              sdk: flutter
            flutter_driver:
              sdk: flutter
            integration_test:
              sdk: flutter
            sky_engine:
              sdk: flutter
          EOF
          
          flutter pub get --no-example
      - name: Inject Production Secrets
        run: |
          cat > ../secrets.json <<EOF
          {"SUPABASE_URL":"${{ secrets.SUPABASE_URL }}","SUPABASE_ANON_KEY":"${{ secrets.SUPABASE_ANON_KEY }}","GEMINI_API_KEY":"${{ secrets.GEMINI_API_KEY }}","OPENAI_KEY":"${{ secrets.OPENAI_KEY }}","GROQ_API_KEY":"${{ secrets.GROQ_API_KEY }}","VERTEX_API_KEY":"${{ secrets.VERTEX_API_KEY }}","HEYGEN_KEY":"${{ secrets.HEYGEN_KEY }}","RUNWAYML_API_SECRET":"${{ secrets.RUNWAYML_API_SECRET }}","TRIPO_API_KEY":"${{ secrets.TRIPO_API_KEY }}","PEXELS_API_KEY":"${{ secrets.PEXELS_API_KEY }}","MTN_API_KEY":"$(echo "${{ secrets.MTN_API_KEY }}" | tr -d '\r\n\t ')","ELEVEN_LAB_API_KEY":"${{ secrets.ELEVEN_LAB_API_KEY }}"}
          EOF
      - name: Build Genuine Android APK
        run: |
          mkdir -p android
          echo -e "flutter.sdk=$FLUTTER_ROOT\nflutter.buildMode=release\nflutter.versionName=1.0.0\nflutter.versionCode=1" > android/local.properties
          echo -e "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx4g" > android/gradle.properties
          
          if [ -n "${{ secrets.SIGNING_STORE_PASSWORD }}" ]; then
            echo -e "SIGNING_STORE_FILE=../debug.keystore\nSIGNING_STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}\nSIGNING_KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}\nSIGNING_KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> android/key.properties
          fi
          
          flutter build apk --release --android-skip-build-dependency-validation --dart-define-from-file=../secrets.json
          
          mkdir -p build/app/outputs/flutter-apk/
          cp build/app/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/app-release.apk 2>/dev/null || find build/app/outputs/ -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/app-release.apk \;
      - name: Build Genuine Web Application
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define-from-file=../secrets.json
      - run: rm -f ../secrets.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: MindSpark-Fat-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: build/web
        continue-on-error: true
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
