name: m1
on: [workflow_dispatch]
permissions: {contents: write, actions: write, pages: write, id-token: write}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Reset Permissions
        run: sudo chmod -R 777 . || true
        
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
          
      - name: Generate Secrets Map
        env:
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
          OPENAI_KEY: "${{ secrets.OPENAI_KEY }}"
          GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"
          VERTEX_API_KEY: "${{ secrets.VERTEX_API_KEY }}"
          HEYGEN_KEY: "${{ secrets.HEYGEN_KEY }}"
          RUNWAYML_API_SECRET: "${{ secrets.RUNWAYML_API_SECRET }}"
          TRIPO_API_KEY: "${{ secrets.TRIPO_API_KEY }}"
          PEXELS_API_KEY: "${{ secrets.PEXELS_API_KEY }}"
          MTN_API_KEY: "${{ secrets.MTN_API_KEY }}"
          ELEVEN_LAB_API_KEY: "${{ secrets.ELEVEN_LAB_API_KEY }}"
        run: |
          python3 -c '
          import os, json
          keys = ["SUPABASE_URL", "SUPABASE_ANON_KEY", "GEMINI_API_KEY", "OPENAI_KEY", "GROQ_API_KEY", "VERTEX_API_KEY", "HEYGEN_KEY", "RUNWAYML_API_SECRET", "TRIPO_API_KEY", "PEXELS_API_KEY", "MTN_API_KEY", "ELEVEN_LAB_API_KEY"]
          data = {k: os.environ.get(k, "").strip().replace("\r", "").replace("\n", "").replace("\"", "") for k in keys}
          with open("secrets.json", "w", encoding="utf-8") as f:
              json.dump(data, f)
          '
          mkdir -p android && echo "storePassword=" > android/local.properties
          
      - name: Setup Manifest Engine
        run: |
          find . -name "settings.gradle" -type f -exec sed -i "s/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g" {} + || true
          mkdir -p android/app/src/main || true
          python3 -c '
          import os
          p = "android/app/src/main/AndroidManifest.xml"
          q = chr(34)
          xml = f"""<manifest xmlns:android={q}http://android.com{q} package={q}com.example.mindspark1{q}>
              <uses-permission android:name={q}android.permission.INTERNET{q}/>
              <uses-permission android:name={q}android.permission.ACCESS_NETWORK_STATE{q}/>
              <uses-permission android:name={q}android.permission.WAKE_LOCK{q}/>
              <uses-permission android:name={q}android.permission.RECEIVE_BOOT_COMPLETED{q}/>
              <uses-permission android:name={q}android.permission.VIBRATE{q}/>
              <uses-permission android:name={q}android.permission.CAMERA{q}/>
              <application android:label={q}Mindspark{q} android:name={q}androidx.multidex.MultiDexApplication{q} android:icon={q}@mipmap/ic_launcher{q} android:usesCleartextTraffic={q}true{q} android:hardwareAccelerated={q}true{q} android:largeHeap={q}true{q}>
                  <activity android:name={q}.MainActivity{q} android:exported={q}true{q} android:launchMode={q}singleTop{q} android:theme={q}@style/LaunchTheme{q} android:configChanges={q}orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode{q} android:windowSoftInputMode={q}adjustResize{q}>
                      <meta-data android:name={q}io.flutter.embedding.android.NormalTheme{q} android:resource={q}@style/NormalTheme{q} />
                      <intent-filter>
                          <action android:name={q}android.intent.action.MAIN{q}/>
                          <category android:name={q}android.intent.category.LAUNCHER{q}/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name={q}flutterEmbedding{q} android:value={q}2{q} />
              </application>
          </manifest>"""
          with open(p, "w", encoding="utf-8") as f:
              f.write(xml)
          '
          flutter clean || true
          flutter pub get || true
          
      - name: Build Web Target
        run: |
          mkdir -p web || true
          echo '<!DOCTYPE html><html><head><base href="/"><script src="flutter_bootstrap.js" async></script></head><body></body></html>' > web/index.html
          flutter build web --release --base-href "/" --dart-define-from-file=secrets.json
          
      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
          
      - name: Build Android Target
        run: flutter build apk --release --dart-define-from-file=secrets.json --android-skip-build-dependency-validation
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
