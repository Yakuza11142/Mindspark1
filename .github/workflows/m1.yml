buildscript {
    ext.kotlin_version = '2.0.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // 🚀 THE AIRTIGHT NATIVE ENFORCER: Injects namespaces into extensions maps before AGP plugins evaluate
    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.library') || project.plugins.hasPlugin('com.android.application')) {
            if (project.android.namespace == null) {
                // Generates a bulletproof fallback namespace using the specific plugin folder name
                String cleanName = project.name.replaceAll(/[^a-zA-Z0-9_]/, "")
                project.android.namespace = "com.mindspark.generated.${cleanName}"
                logger.quiet("🚀 Hard-patched missing namespace for module [${project.name}] -> [${project.android.namespace}]")
            }
        }
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
