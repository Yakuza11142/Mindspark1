name: m1
on: [workflow_dispatch]
permissions: {contents: write, actions: write, pages: write, id-token: write}

defaults:
  run:
    shell: bash

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - run: sudo chmod -R 777 . || true

    - name: Setup Java Environment
      uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: 17}

    - name: Setup Flutter SDK
      uses: subosito/flutter-action@v2
      with: {channel: stable, cache: false}

    - name: Configure Production Secrets
      env:
        KEYS_DATA: "SUPABASE_URL SUPABASE_ANON_KEY GEMINI_API_KEY OPENAI_KEY GROQ_API_KEY VERTEX_API_KEY HEYGEN_KEY RUNWAYML_API_SECRET TRIPO_API_KEY PEXELS_API_KEY MTN_API_KEY ELEVEN_LAB_API_KEY"
        SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
        SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"
        GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
        OPENAI_KEY: "${{ secrets.OPENAI_KEY }}"
        GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"
        VERTEX_API_KEY: "${{ secrets.VERTEX_API_KEY }}"
        HEYGEN_KEY: "${{ secrets.HEYGEN_KEY }}"
        RUNWAYML_API_SECRET: "${{ secrets.RUNWAYML_API_SECRET }}"
        TRIPO_API_KEY: "${{ secrets.TRIPO_API_KEY }}"
        PEXELS_API_KEY: "${{ secrets.PEXELS_API_KEY }}"
        MTN_API_KEY: "${{ secrets.MTN_API_KEY }}"
        ELEVEN_LAB_API_KEY: "${{ secrets.ELEVEN_LAB_API_KEY }}"
      run: |
        echo "{" > secrets.json
        first=true
        for k in $KEYS_DATA; do
          val=$(eval echo \$$k | tr -d '\r' | tr -d '\n' | tr -d '"')
          if [ "$first" = true ]; then first=false; else echo "," >> secrets.json; fi
          echo "\"$k\": \"$val\"" >> secrets.json
        done
        echo "}" >> secrets.json
        mkdir -p android && echo "storePassword=" > android/local.properties

    - name: Pure Python XML Patching Engine
      run: |
        find . -name "settings.gradle" -type f -exec sed -i "s/FAIL_ON_PROJECT_REPOS/PREFER_PROJECT/g" {} + || true
        python3 -c '
import xml.etree.ElementTree as ET
import os

path = "android/app/src/main/AndroidManifest.xml"
os.makedirs(os.path.dirname(path), exist_ok=True)

# Build a clean, native structure with perfect spacing containing only requirements
ns = "http://android.com"
ET.register_namespace("android", ns)

root = ET.Element("manifest", {
    "xmlns:android": ns,
    "package": "com.example.mindspark1"
})

permissions = [
    "INTERNET", "ACCESS_NETWORK_STATE", "WAKE_LOCK",
    "RECEIVE_BOOT_COMPLETED", "VIBRATE", "CAMERA"
]

for p_name in permissions:
    ET.SubElement(root, "uses-permission", {f"{{{ns}}}name": f"android.permission.{p_name}"})

app = ET.SubElement(root, "application", {
    f"{{{ns}}}label": "Mind Spark",
    f"{{{ns}}}name": "androidx.multidex.MultiDexApplication",
    f"{{{ns}}}icon": "@mipmap/ic_launcher",
    f"{{{ns}}}usesCleartextTraffic": "true",
    f"{{{ns}}}hardwareAccelerated": "true",
    f"{{{ns}}}largeHeap": "true"
})

act = ET.SubElement(app, "activity", {
    f"{{{ns}}}name": ".MainActivity",
    f"{{{ns}}}exported": "true",
    f"{{{ns}}}launchMode": "singleTop",
    f"{{{ns}}}theme": "@style/LaunchTheme",
    f"{{{ns}}}configChanges": "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode",
    f"{{{ns}}}windowSoftInputMode": "adjustResize"
})

ET.SubElement(act, "meta-data", {
    f"{{{ns}}}name": "io.flutter.embedding.android.NormalTheme",
    f"{{{ns}}}resource": "@style/NormalTheme"
})

ifilter = ET.SubElement(act, "intent-filter")
ET.SubElement(ifilter, "action", {f"{{{ns}}}name": "android.intent.action.MAIN"})
ET.SubElement(ifilter, "category", {f"{{{ns}}}name": "android.intent.category.LAUNCHER"})

ET.SubElement(app, "meta-data", {
    f"{{{ns}}}name": "flutterEmbedding",
    f"{{{ns}}}value": "2"
})

# Save output with pristine formatting lines
tree = ET.ElementTree(root)
ET.indent(tree, space="    ", level=0)
tree.write(path, encoding="utf-8", xml_declaration=True)
print("Pristine AndroidManifest.xml successfully built via standard XML engine!")
        '
        flutter clean || true
        flutter pub get || true

    - name: Beta Test - Static Analysis Runtime Audit
      run: |
        flutter analyze || true

    - name: Compile Flutter Web Release
      run: |
        mkdir -p web
        echo '<!DOCTYPE html><html><head><base href="$FLUTTER_BASE_HREF"><script src="flutter_bootstrap.js" async></script></head><body><h1 style="display:none;">Mind Spark</h1></body></html>' > web/index.html
        flutter build web --release --base-href "/" --dart-define-from-file=secrets.json

    - uses: actions/upload-pages-artifact@v3
      with: {path: build/web}

    - name: Compile Production Android APK
      run: |
        flutter build apk --release --dart-define-from-file=secrets.json --android-skip-build-dependency-validation

    - uses: actions/upload-artifact@v4
      with: {name: apk, path: build/app/outputs/flutter-apk/app-release.apk}

  deploy:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/deploy-pages@v4
