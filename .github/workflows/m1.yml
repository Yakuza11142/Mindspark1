name: MindSpark Production CI
on: [workflow_dispatch, push]
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: mindspark-production, cancel-in-progress: true}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.11.1", validate-wrappers: false}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: false}
        
      - name: Sandbox Template Factory Execution
        run: |
          # [Shortened for brevity - Executes project setup, dependency definition, and file patching]
          mkdir -p ../vault/ && ([ -d "lib" ] && cp -r lib ../vault/ || mkdir -p ../vault/lib)
          # ... (rest of setup script) ...
          cat << 'EOF' > pubspec.yaml
          name: mindspark1
          publish_to: "none"
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            # ... (dependencies) ...
          EOF
          find . -type f -exec sed -i '/pqc/d' {} + || true
          flutter pub get --no-example

      - name: Inject Secrets Safely
        run: |
          # [Injects GitHub Action secrets into a temporary JSON file]
          echo "{\"SUPABASE_URL\":\"${{ secrets.SUPABASE_URL }}\", ...}" > ../secrets.json

      - name: Build Genuine Android APK with Auto-Healer compiler
        run: |
          # [Builds Android APK using automated fixes for gradle/manifest issues]
          flutter build apk --debug --dart-define-from-file=../secrets.json

      - name: Build Genuine Web Application
        run: |
          # [Builds Web application with automatic resource/path patching]
          flutter build web --release --base-href="/${{ github.event.repository.name }}/"

      - name: Setup Pages Infrastructure
        uses: actions/configure-pages@v5

      - name: Pack Web Distribution Package
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      - name: Live Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-apk
          path: final_apk/app-debug.apk
