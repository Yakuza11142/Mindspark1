name: MindSpark Ultimate Production CI
on:
  push:
    branches: [main, master, dev, "**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Build MindSpark Android Fat APK and Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: 
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.warning.mode=none -Dandroid.suppressUnsupportedCompileSdk=true -Dorg.gradle.vfs.watch=false"
      JAVA_TOOL_OPTIONS: "-Xmx4g"
      KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}"
      KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
      KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
      KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"

    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean Build Workspace
        run: |
          rm -rf ~/.gradle/ || true
          rm -f ~/.gradle/init.gradle || true
          flutter clean || true
          rm -rf pubspec.lock .dart_tool/ build/ android/.gradle/ android/app/build/ symbols/

      - name: Regenerate Platforms
        run: |
          rm -rf android
          flutter create --platforms=android,web . || true

      - name: Resolve Dependencies & Format Code
        run: |
          flutter pub get
          dart fix --apply || true
          dart format . || true

      - name: Safely Generate Secrets JSON
        env:
          RAW_SECRETS: ${{ toJson(secrets) }}
        run: |
          rm -rf lib/config/secrets.dart || true
          cat << 'EOF' > make_secrets.py
          import json, os

          raw = os.environ.get('RAW_SECRETS', '{}')
          try:
              data = json.loads(raw)
          except Exception:
              data = {}

          exclude = {'KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'}
          clean_secrets = {}

          for k, v in data.items():
              if k not in exclude and v is not None:
                  clean_secrets[k] = str(v).strip()

          with open('secrets.json', 'w', encoding='utf-8') as f:
              json.dump(clean_secrets, f, ensure_ascii=False, indent=2)

          print(f"Generated secrets.json with {len(clean_secrets)} keys.")
          EOF
          python3 make_secrets.py
          rm make_secrets.py

      - name: Strip Removed Dependency References
        run: |
          cat << 'EOF' > purge_missing.py
          import os

          missing_pkgs = ['image_picker', 'share_plus', 'in_app_purchase']
          missing_imports = ['../config/secrets.dart', 'config/secrets.dart']
          
          for root, _, files in os.walk('lib'):
              for file in files:
                  if file.endswith('.dart'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          lines = f.readlines()
                      
                      new_lines = []
                      for line in lines:
                          if any(f"package:{pkg}/" in line for pkg in missing_pkgs) or any(imp in line for imp in missing_imports):
                              new_lines.append(f"// {line}")
                          elif ".anonymousId" in line:
                              new_lines.append(line.replace(".anonymousId", " ?? 'User'"))
                          else:
                              new_lines.append(line)
                      
                      with open(path, 'w', encoding='utf-8') as f:
                          f.writelines(new_lines)

          print("Purged missing file imports and unused dependencies.")
          EOF
          python3 purge_missing.py
          rm purge_missing.py

      - name: Validate Lib Entry Point
        run: |
          cat << 'EOF' > sanitize_lib.py
          import os
          main_path = "lib/main.dart"
          if not os.path.exists(main_path):
              print("CRITICAL ERROR: lib/main.dart is missing from the repository.")
              exit(1)
          content = open(main_path, encoding='utf-8', errors='ignore').read()
          if "void main" not in content:
              print("CRITICAL ERROR: void main() entry point missing in lib/main.dart")
              exit(1)
          print("lib/main.dart validation successful.")
          EOF
          python3 sanitize_lib.py
          rm sanitize_lib.py

      - name: Configure Android SDK
        run: |
          echo "flutter.compileSdkVersion=37" > android/local.properties
          echo "flutter.targetSdkVersion=37" >> android/local.properties
          sed -i '/android.enableR8/d' android/gradle.properties 2>/devnull || true
          echo "android.experimental.newDsl=false" >> android/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=true" >> android/gradle.properties
          echo "android.lintOptions.abortOnError=false" >> android/gradle.properties
          echo "android.lintOptions.checkReleaseBuilds=false" >> android/gradle.properties
          echo "org.gradle.vfs.watch=false" >> android/gradle.properties
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  repositories {
                      all { ArtifactRepository repo ->
                          if (repo.name.contains("jcenter") || repo.name.contains("JCenter")) {
                              project.logger.lifecycle("Replacing jcenter with mavenCentral in buildscript")
                              remove(repo)
                          }
                      }
                      mavenCentral()
                      google()
                  }
              }
              repositories {
                  all { ArtifactRepository repo ->
                      if (repo.name.contains("jcenter") || repo.name.contains("JCenter")) {
                          project.logger.lifecycle("Replacing jcenter with mavenCentral in repositories")
                          remove(repo)
                      }
                  }
                  mavenCentral()
                  google()
              }
          }
          EOF
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
            echo "storeFile=release.keystore" >> android/key.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          fi
          cat << 'EOF' > android/app/proguard-rules.pro
          -dontwarn **
          -ignorewarnings
          -keep class io.flutter.plugin.** { *; }
          -keep class ** { *; }
          EOF
          cat << 'EOF' > fix_build.py
          import os
          groovy_path = "android/app/build.gradle"
          kts_path = "android/app/build.gradle.kts"
          if os.path.exists(groovy_path):
              content = open(groovy_path).read()
              lines = content.splitlines()
              new_lines = []
              for line in lines:
                  if "compileSdk" in line and "=" not in line:
                      new_lines.append("    compileSdk 37")
                  elif "compileSdk =" in line or "compileSdkVersion" in line:
                      new_lines.append("    compileSdk 37")
                  elif "minifyEnabled true" in line:
                      new_lines.append("            minifyEnabled false")
                  elif "shrinkResources true" in line:
                      new_lines.append("            shrinkResources false")
                  else:
                      new_lines.append(line)
              content = "\n".join(new_lines)
              content = content.replace("coreLibraryDesugaringEnabled true", "coreLibraryDesugaringEnabled false")
              if "proguardFiles" not in content:
                  content = content.replace("buildTypes {", "buildTypes {\n        release {\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n        }")
              open(groovy_path, "w").write(content)
          if os.path.exists(kts_path):
              content = open(kts_path).read()
              lines = content.splitlines()
              new_lines = []
              for line in lines:
                  if "compileSdk =" in line:
                      new_lines.append("    compileSdk = 37")
                  elif "isMinifyEnabled = true" in line:
                      new_lines.append("            isMinifyEnabled = false")
                  elif "isShrinkResources = true" in line:
                      new_lines.append("            isShrinkResources = false")
                  else:
                      new_lines.append(line)
              content = "\n".join(new_lines)
              content = content.replace("isCoreLibraryDesugaringEnabled = true", "isCoreLibraryDesugaringEnabled = false")
              if "proguardFiles" not in content:
                  content = content.replace("buildTypes {", "buildTypes {\n        getByName(\"release\") {\n            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")\n        }")
              open(kts_path, "w").write(content)
          EOF
          python3 fix_build.py
          rm fix_build.py

      - name: Build Standalone Universal Fat Release Android APK
        run: |
          rm -rf ~/.gradle/ || true
          rm -f ~/.gradle/init.gradle || true
          flutter build apk --release \
            --no-pub \
            --no-tree-shake-icons \
            --target=lib/main.dart \
            --dart-define-from-file=secrets.json

      - name: Build Web Application
        run: |
          flutter config --enable-web || true
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          
          flutter build web --release \
            --no-pub \
            --base-href="/${REPO_NAME}/" \
            --dart-define-from-file=secrets.json \
            --target=lib/main.dart
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

      - name: Purge Generated Secrets JSON
        if: always()
        run: |
          rm -f secrets.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Pack Production Assets
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Upload Universal Fat Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindspark-universalfat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy:
    name: Deploy Web App to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
