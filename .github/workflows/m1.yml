name: MindSpark Production CI
on:
  push: { branches: [main, master, dev, "**"] }
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: mindspark-production, cancel-in-progress: false }

jobs:
  build:
    name: Build MindSpark Android and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GLOBAL CONFIGURATION: All operational and cryptographic keys declared uniformly
    env: 
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
      JAVA_TOOL_OPTIONS: "-Xmx4g"
      # API & Database Secrets
      SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
      SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"
      GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
      OPENAI_KEY: "${{ secrets.OPENAI_KEY }}"
      GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"
      VERTEX_API_KEY: "${{ secrets.VERTEX_API_KEY }}"
      HEYGEN_KEY: "${{ secrets.HEYGEN_KEY }}"
      RUNWAYML_API_SECRET: "${{ secrets.RUNWAYML_API_SECRET }}"
      TRIPO_API_KEY: "${{ secrets.TRIPO_API_KEY }}"
      PEXELS_API_KEY: "${{ secrets.PEXELS_API_KEY }}"
      MTN_API_KEY: "${{ secrets.MTN_API_KEY }}"
      ELEVEN_LAB_API_KEY: "${{ secrets.ELEVEN_LAB_API_KEY }}"
      # Cryptographic Keystore Secrets
      KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}"
      KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
      KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
      KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java Runtime
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Setup Android Infrastructure
        uses: android-actions/setup-android@v3

      - name: Accept Developer Licenses
        run: yes | sdkmanager --licenses || true; sdkmanager --update || true

      - name: Factory Sandbox Setup
        run: |
          mkdir -p ../vault/lib ../vault/assets ../vault/web
          [ -d "lib" ] && cp -r lib/* ../vault/lib/ || true
          [ -d "assets" ] && cp -r assets/* ../vault/assets/ || true
          [ -d "web" ] && cp -r web/* ../vault/web/ || true
          
          rm -f pubspec.yaml pubspec.lock pubspec_overrides.yaml
          rm -rf android ios windows macos linux build
          
          flutter create --org com.mindspark --project-name mindspark1 --platforms=android,web .
          
          rm -rf lib assets web
          cp -r ../vault/lib ./lib
          cp -r ../vault/assets ./assets
          cp -r ../vault/web ./web
          
          cat << 'EOF' > pubspec.yaml
          name: mindspark1
          description: MindSpark Scalable 3D Vector Hologram Engine
          publish_to: "none"
          version: 1.0.0+1
          environment:
            sdk: ">=3.12.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            provider: any
            flutter_dotenv: any
            supabase_flutter: any
            google_mobile_ads: any
            flutter_jailbreak_detection: any
            flutter_secure_storage: any
            ar_flutter_plugin_plus: any
          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF
          
          sed -i '/pqc/d' pubspec.yaml || true
          echo "dependency_overrides: {android_intent_plus: ^5.0.2, flutter_test: {sdk: flutter},flutter_driver: {sdk: flutter},integration_test: {sdk: flutter},sky_engine: {sdk: flutter}}" > pubspec_overrides.yaml

      - name: Native Toolchain Code Optimization
        run: |
          echo -e "analyzer:\n  exclude:\n    - 'build/**'\n  errors:\n    todo: ignore\nlinter:\n  rules: []" > analysis_options.yaml
          flutter pub get --no-example || true
          dart format lib/ || true
          dart fix --apply || true

      - name: Android Build Patching & Acceptable Framework Configuration
        shell: bash
        run: |
          rm -rf android/app/src/main/kotlin/com/mindspark/mindspark1/*
          mkdir -p android/app/src/main/kotlin/com/mindspark/mindspark1
          echo -e "package com.mindspark.mindspark1\nimport io.flutter.embedding.android.FlutterActivity\nclass MainActivity : FlutterActivity()" > android/app/src/main/kotlin/com/mindspark/mindspark1/MainActivity.kt
          
          echo -e "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.enableJetifier=true" > android/gradle.properties
          
          python3 -c "import json,os;secrets={k:os.environ.get(k,'').strip() for k in ['SUPABASE_URL','SUPABASE_ANON_KEY','GEMINI_API_KEY','OPENAI_KEY','GROQ_API_KEY','VERTEX_API_KEY','HEYGEN_KEY','RUNWAYML_API_SECRET','TRIPO_API_KEY','PEXELS_API_KEY','MTN_API_KEY','ELEVEN_LAB_API_KEY']};open('../secrets.json','w').write(json.dumps(secrets))"
          
          echo "flutter.compileSdkVersion=37" >> android/local.properties
          echo "flutter.targetSdkVersion=37" >> android/local.properties
          
          # Map key properties matching variable layout profiles dynamically
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "storeFile=../../release.keystore" >> android/key.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            print("Successfully configured release properties target mapping.")
          fi

          mkdir -p ~/.gradle
          echo "allprojects {" > ~/.gradle/init.gradle
          echo "    beforeEvaluate { project ->" >> ~/.gradle/init.gradle
          echo "        if (project.hasProperty('android')) {" >> ~/.gradle/init.gradle
          echo "            if (project.android.namespace == null) {" >> ~/.gradle/init.gradle
          echo "                project.android.namespace = 'com.mindspark.mindspark1'" >> ~/.gradle/init.gradle
          echo "            }" >> ~/.gradle/init.gradle
          echo "        }" >> ~/.gradle/init.gradle
          echo "    }" >> ~/.gradle/init.gradle
          echo "}" >> ~/.gradle/init.gradle
          
          flutter pub get --no-example || true
          rm -rf /home/runner/.pub-cache/hosted/pub.dev/arcore_flutter_plus-*

          find /home/runner/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/configurations\.all\s*\r*\{/\/\/ configurations.all disabled {/g' {} + 2>/dev/null || true
          find /home/runner/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i -e 's/jcenter()/mavenCentral()/g' -e 's/google()/google(); mavenCentral()/g' {} + 2>/dev/null || true

          python3 -c '
          import os, glob, re
          for g in glob.glob("/home/runner/.pub-cache/hosted/pub.dev/**/build.gradle", recursive=True):
              try:
                  content = open(g).read()
                  if "android {" in content and "namespace" not in content:
                      manifest_path = os.path.join(os.path.dirname(g), "src", "main", "AndroidManifest.xml")
                      if os.path.exists(manifest_path):
                          manifest_content = open(manifest_path).read()
                          pkg_match = re.search(r"package\s*=\s*[\"']([^\"']+)[\"']", manifest_content)
                          if pkg_match:
                              pkg_name = pkg_match.group(1)
                              content = content.replace("android {", f"android {{\n    namespace \"{pkg_name}\"")
                              open(g, "w").write(content)
              except: pass
          ' || true

      # Decodes the key format into binary directly on the workspace directory root
      - name: Unpack Secure Production Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build Obfuscated Android APK
        run: |
          mkdir -p ../symbols
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=../symbols \
            --android-skip-build-dependency-validation \
            --dart-define-from-file=../secrets.json

      - name: Build Genuine Web Application & Auto-Heal Layout Architecture
        run: |
          rm -rf build/web web
          flutter create --platforms=web --org com.mindspark --project-name mindspark1 .
          sed -i 's|<base href="/">|<base href="/${{ github.event.repository.name }}/">|g' web/index.html || true
          flutter build web --release \
            --extra-front-end-options=--obfuscate \
            --dart-define-from-file=../secrets.json
          sed -i "s/flutter_service_worker.js/flutter_service_worker.js?v=\$(date +%s)/g" build/web/index.html 2>/dev/null || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Pack Production Assets
        uses: actions/upload-pages-artifact@v3
        with: { path: build/web }

      - name: Deploy Web App to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with: { name: mindspark-release-apk, path: build/app/outputs/flutter-apk/app-release.apk }

      - name: Upload Obfuscation Symbols
        uses: actions/upload-artifact@v4
        with: { name: mindspark-obfuscation-symbols, path: ../symbols/ }
