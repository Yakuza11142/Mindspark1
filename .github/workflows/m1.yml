name: MindSpark Ultimate Production CI

on:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mindspark-production-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build MindSpark Android Fat APK + Web
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dfile.encoding=UTF-8
        -Dorg.gradle.warning.mode=none
        -Dorg.gradle.vfs.watch=false
      JAVA_TOOL_OPTIONS: "-Xmx4g"

      SIGNING_STORE_FILE: android/release.keystore
      SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Toolchain
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Clean Flutter Workspace
        run: |
          flutter clean || true
          rm -rf build/
          rm -rf .dart_tool/

      # ============================================================
      # COMPLETELY DELETE AND RECREATE THE ANDROID DIRECTORY
      # NATIVELY SUPPORTING FLUTTER KOTLIN DSL CONFIGURATION
      # ============================================================
      - name: Completely Recreate Android Directory
        run: |
          echo "=========================================="
          echo "REMOVING ENTIRE ANDROID DIRECTORY"
          echo "=========================================="

          rm -rf android

          if [ -d "android" ]; then
            echo "ERROR: android directory still exists."
            exit 1
          fi

          echo "Generating completely fresh Android project..."

          flutter create \
            --platforms=android \
            --project-name=mindspark1 \
            .

          if [ ! -d "android" ]; then
            echo "ERROR: Flutter failed to create android directory."
            exit 1
          fi

          # Bootstrap the Gradle wrapper files
          echo "Bootstrapping Gradle wrapper..."
          flutter build apk --config-only || true

          echo "=========================================="
          echo "VERIFYING FRESH ANDROID DIRECTORY"
          echo "=========================================="

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties

          # Verify build scripts (supports both .kts and Groovy)
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

          chmod +x android/gradlew

          echo "Fresh Android directory created and verified successfully."

      - name: Resolve Dependencies
        run: |
          flutter pub get

      - name: Apply Dart Fixes
        run: |
          dart fix --apply

      - name: Format Dart Code
        run: |
          dart format lib

      - name: Validate Flutter Project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          grep -q "void main" lib/main.dart

          echo "Flutter project validation successful."

      - name: Generate Production Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
        run: |
          python3 <<'PY'
          import json
          import os

          values = {
              "SUPABASE_URL": os.environ.get("SUPABASE_URL", "").strip(),
              "SUPABASE_ANON_KEY": os.environ.get("SUPABASE_ANON_KEY", "").strip(),
              "SERVER_URL": os.environ.get("SERVER_URL", "").strip(),
          }

          required = [
              "SUPABASE_URL",
              "SUPABASE_ANON_KEY",
          ]

          missing = [
              key for key in required
              if not values.get(key)
          ]

          if missing:
              raise SystemExit(
                  "Missing required GitHub secrets: "
                  + ", ".join(missing)
              )

          values = {
              key: value
              for key, value in values.items()
              if value
          }

          with open("secrets.json", "w", encoding="utf-8") as file:
              json.dump(values, file, indent=2)

          print(
              "Generated secrets.json with "
              f"{len(values)} compile-time values."
          )
          PY

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore

            test -s android/release.keystore

            echo "Release keystore prepared successfully."
          else
            echo "KEYSTORE_BASE64 is not configured."
            echo "Continuing with Flutter/Android default release signing."
          fi

      - name: Build Universal Fat Release APK
        run: |
          flutter build apk \
            --release \
            --no-pub \
            --no-tree-shake-icons \
            --target=lib/main.dart \
            -Pdisable-abi-filtering=true \
            --dart-define-from-file=secrets.json

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERROR: Release APK is empty."
            exit 1
          fi

          echo "=========================================="
          echo "MINDSpark APK BUILD SUCCESSFUL"
          echo "=========================================="

          ls -lh "$APK"

      - name: Build Flutter Web
        run: |
          flutter config --enable-web

          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          flutter build web \
            --release \
            --no-pub \
            --target=lib/main.dart \
            --base-href="/${REPO_NAME}/" \
            --dart-define-from-file=secrets.json

          test -f build/web/index.html

          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

          echo "=========================================="
          echo "WEB BUILD SUCCESSFUL"
          echo "=========================================="

          du -sh build/web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Upload Universal Fat APK
        uses: actions/upload-artifact@v4
        with:
          name: mindspark-universalfat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup Generated Secrets
        if: always()
        run: |
          rm -f secrets.json
          rm -f android/release.keystore
          rm -f android/key.properties

  deploy:
    name: Deploy MindSpark Web to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
