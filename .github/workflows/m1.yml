name: MindSpark Ultimate Production CI
on:
  push:
    branches: [main, master, dev, "**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mindspark-production
  cancel-in-progress: true

jobs:
  build:
    name: Build MindSpark Android Fat APK and Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: 
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Dorg.gradle.warning.mode=none -Dandroid.suppressUnsupportedCompileSdk=true -Dorg.gradle.vfs.watch=false"
      JAVA_TOOL_OPTIONS: "-Xmx4g"
      SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
      SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}"
      KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}"
      KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
      KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
      KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean Build Workspace
        run: |
          rm -rf ~/.gradle/ || true
          rm -f ~/.gradle/init.gradle || true
          flutter clean || true
          rm -rf pubspec.lock .dart_tool/ build/ android/.gradle/ android/app/build/ symbols/
          flutter pub cache clean --force || true

      - name: Remove Old Dependencies and Clean Source Code
        run: |
          cat << 'EOF' > purge_old_deps.py
          import os

          # List of deleted packages to purge
          old_packages = [
              "flutter_local_notifications",
              "arcore_flutter_plus",
              "carrier_info",
              "flutter_jailbreak_detection",
              "flutter_windowmanager",
              "ios_insecure_screen_detector",
              "environment_sensors"
          ]

          # 1. Remove only the specific package lines from pubspec.yaml
          if os.path.exists("pubspec.yaml"):
              with open("pubspec.yaml", "r", encoding="utf-8") as f:
                  lines = f.readlines()
              
              clean_pubspec_lines = [
                  line for line in lines 
                  if not any(pkg in line for pkg in old_packages)
              ]
              
              with open("pubspec.yaml", "w", encoding="utf-8") as f:
                  f.writelines(clean_pubspec_lines)

          # 2. Strip imports and usage of these packages from all Dart source files in lib/
          targets = [f"package:{pkg}/" for pkg in old_packages]
          if os.path.exists("lib"):
              for root, dirs, files in os.walk("lib"):
                  for file in files:
                      if file.endswith(".dart"):
                          path = os.path.join(root, file)
                          try:
                              with open(path, "r", encoding="utf-8") as f:
                                  content = f.read()
                              
                              if any(t in content for t in targets):
                                  lines = content.splitlines()
                                  clean_lines = [l for l in lines if not any(t in l for t in targets)]
                                  new_content = "\n".join(clean_lines)
                                  
                                  with open(path, "w", encoding="utf-8") as f:
                                      f.write(new_content)
                          except Exception as e:
                              print(f"Error processing {path}: {e}")
          EOF
          python3 purge_old_deps.py
          rm purge_old_deps.py

      - name: Resolve Dependencies & Format Code
        run: |
          flutter pub get
          dart fix --apply || true
          dart format . || true

      - name: Configure Production Environment Secrets
        run: |
          cat << 'EOF' > make_secrets.py
          import json, os
          keys = ['SUPABASE_URL','SUPABASE_ANON_KEY']
          secrets = {k: os.environ.get(k, '').strip() for k in keys}
          with open('secrets.json', 'w') as f:
              f.write(json.dumps(secrets))
          EOF
          python3 make_secrets.py
          rm make_secrets.py

      - name: Validate Lib Entry Point
        run: |
          cat << 'EOF' > sanitize_lib.py
          import os
          main_path = "lib/main.dart"
          if not os.path.exists(main_path):
              print("CRITICAL ERROR: lib/main.dart is missing from the repository.")
              exit(1)
          content = open(main_path).read()
          if "void main" not in content:
              print("CRITICAL ERROR: void main() entry point missing in lib/main.dart")
              exit(1)
          print("lib/main.dart validation successful. Building real application code.")
          EOF
          python3 sanitize_lib.py
          rm sanitize_lib.py

      - name: Regenerate Platforms & Configure Android SDK
        run: |
          rm -rf android
          flutter create --platforms=android,web . || true
          echo "flutter.compileSdkVersion=37" > android/local.properties
          echo "flutter.targetSdkVersion=37" >> android/local.properties
          sed -i '/android.enableR8/d' android/gradle.properties 2>/devnull || true
          echo "android.experimental.newDsl=false" >> android/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=true" >> android/gradle.properties
          echo "android.lintOptions.abortOnError=false" >> android/gradle.properties
          echo "android.lintOptions.checkReleaseBuilds=false" >> android/gradle.properties
          echo "org.gradle.vfs.watch=false" >> android/gradle.properties
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  repositories {
                      all { ArtifactRepository repo ->
                          if (repo.name.contains("jcenter") || repo.name.contains("JCenter")) {
                              project.logger.lifecycle("Replacing jcenter with mavenCentral in buildscript")
                              remove(repo)
                          }
                      }
                      mavenCentral()
                      google()
                  }
              }
              repositories {
                  all { ArtifactRepository repo ->
                      if (repo.name.contains("jcenter") || repo.name.contains("JCenter")) {
                          project.logger.lifecycle("Replacing jcenter with mavenCentral in repositories")
                          remove(repo)
                      }
                  }
                  mavenCentral()
                  google()
              }
          }
          EOF
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
            echo "storeFile=release.keystore" >> android/key.properties
            echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
            echo "keyAlias=$KEY_ALIAS" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          fi
          cat << 'EOF' > android/app/proguard-rules.pro
          -dontwarn **
          -ignorewarnings
          -keep class io.flutter.plugin.** { *; }
          -keep class ** { *; }
          EOF
          cat << 'EOF' > fix_build.py
          import os
          groovy_path = "android/app/build.gradle"
          kts_path = "android/app/build.gradle.kts"
          if os.path.exists(groovy_path):
              content = open(groovy_path).read()
              lines = content.splitlines()
              new_lines = []
              for line in lines:
                  if "compileSdk" in line and "=" not in line:
                      new_lines.append("    compileSdk 37")
                  elif "compileSdk =" in line or "compileSdkVersion" in line:
                      new_lines.append("    compileSdk 37")
                  elif "minifyEnabled true" in line:
                      new_lines.append("            minifyEnabled false")
                  elif "shrinkResources true" in line:
                      new_lines.append("            shrinkResources false")
                  else:
                      new_lines.append(line)
              content = "\n".join(new_lines)
              content = content.replace("coreLibraryDesugaringEnabled true", "coreLibraryDesugaringEnabled false")
              if "proguardFiles" not in content:
                  content = content.replace("buildTypes {", "buildTypes {\n        release {\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'\n        }")
              open(groovy_path, "w").write(content)
          if os.path.exists(kts_path):
              content = open(kts_path).read()
              lines = content.splitlines()
              new_lines = []
              for line in lines:
                  if "compileSdk =" in line:
                      new_lines.append("    compileSdk = 37")
                  elif "isMinifyEnabled = true" in line:
                      new_lines.append("            isMinifyEnabled = false")
                  elif "isShrinkResources = true" in line:
                      new_lines.append("            isShrinkResources = false")
                  else:
                      new_lines.append(line)
              content = "\n".join(new_lines)
              content = content.replace("isCoreLibraryDesugaringEnabled = true", "isCoreLibraryDesugaringEnabled = false")
              if "proguardFiles" not in content:
                  content = content.replace("buildTypes {", "buildTypes {\n        getByName(\"release\") {\n            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")\n        }")
              open(kts_path, "w").write(content)
          EOF
          python3 fix_build.py
          rm fix_build.py

      - name: Build Standalone Universal Fat Release Android APK
        run: |
          rm -rf ~/.gradle/ || true
          rm -f ~/.gradle/init.gradle || true
          flutter build apk --release \
            --no-tree-shake-icons \
            --target=lib/main.dart \
            --dart-define-from-file=secrets.json

      - name: Build Web Application
        run: |
          flutter config --enable-web || true
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          
          flutter build web --release \
            --base-href="/${REPO_NAME}/" \
            --dart-define-from-file=secrets.json \
            --target=lib/main.dart
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Pack Production Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Upload Universal Fat Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindspark-universalfat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  deploy:
    name: Deploy Web App to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
