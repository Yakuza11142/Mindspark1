name: MindSpark Production CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mindspark-production
  cancel-in-progress: true

jobs:
  build:
    name: Build MindSpark Android and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
      JAVA_TOOL_OPTIONS: "-Xmx4g"

    steps:
      - name: Checkout MindSpark
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --update || true

      - name: Sandbox Template Factory Execution (Only My Code and Assets)
        run: |
          # 1. Back up your pure code assets securely into a local staging directory
          mkdir -p ../vault/
          [ -d "lib" ] && cp -r lib ../vault/ || mkdir -p ../vault/lib
          [ -d "assets" ] && cp -r assets ../vault/ || mkdir -p ../vault/assets
          [ -d "web" ] && cp -r web ../vault/ || mkdir -p ../vault/web
          [ -f "pubspec.yaml" ] && cp pubspec.yaml ../vault/ || true
          
          # 2. Hard wipe all existing native environment configurations and configuration remnants
          rm -rf android ios windows macos linux build * .[^.]*
          
          # 3. Initialize fresh, pure system templates natively
          flutter create --org com.mindspark --project-name mindspark1 --platforms=android,web --android-language java .
          
          # 4. Wipe out generic template code and overwrite using your authentic repository payload
          rm -rf lib assets web pubspec.yaml
          cp -r ../vault/lib ./lib
          cp -r ../vault/assets ./assets
          cp -r ../vault/web ./web
          [ -f "../vault/pubspec.yaml" ] && cp ../vault/pubspec.yaml ./pubspec.yaml || true

      - name: Fix Pubspec Cleanly via Python
        shell: bash
        run: |
          python3 -c '
          import re

          with open("pubspec.yaml", "r") as f:
              content = f.read()

          content = re.sub(r"!!python/object/apply:[^\n]+", "", content)

          if "environment:" not in content:
              content += "\nenvironment:\n  sdk: \">=3.12.0 <4.0.0\"\n"
          elif "sdk:" not in content:
              content = re.sub(r"(environment:)", r"\1\n  sdk: \">=3.12.0 <4.0.0\"", content)

          with open("pubspec.yaml", "w") as f:
              f.write(content)

          print("pubspec.yaml cleaned successfully.")
          '

      - name: Configure Android
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/kotlin/com/mindspark/mindspark1
          cat > android/app/src/main/kotlin/com/mindspark/mindspark1/MainActivity.kt <<'EOF'
          package com.mindspark.mindspark1

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF

          # 🛡️ GLOBAL DEEP-CACHE NAMESPACE AUTO-FIXER: Ensures third-party packages compile under AGP 9+
          find /home/runner/.pub-cache/hosted/pub.dev/ -name "AndroidManifest.xml" 2>/dev/null | while read -r manifest; do
            PKG=$(grep -oP 'package="\K[^"]+' "$manifest" || true)
            GRADLE_FILE=$(dirname "$manifest")/../build.gradle
            [ ! -f "$GRADLE_FILE" ] && GRADLE_FILE=$(dirname "$manifest")/build.gradle
            if [ -f "$GRADLE_FILE" ] && [ -n "$PKG" ]; then
              sed -i "/namespace\s/d" "$GRADLE_FILE" || true
              sed -i "/android {/a \    namespace \"$PKG\"" "$GRADLE_FILE" || true
            fi
          done

          if [ -f android/gradle.properties ]; then
            grep -q "^org.gradle.jvmargs=" android/gradle.properties || echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> android/gradle.properties
            grep -q "^android.useAndroidX=" android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
            grep -q "^android.enableJetifier=" android/gradle.properties || echo "android.enableJetifier=true" >> android/gradle.properties
          else
            cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          fi

          echo "dependency_overrides: {flutter_test: {sdk: flutter},flutter_driver: {sdk: flutter},integration_test: {sdk: flutter},sky_engine: {sdk: flutter}}" > pubspec_overrides.yaml
          
          # Force dependency preparation and execution fixes
          find lib/ -type f -name "*.dart" -exec sed -i -e "/dash_chat_2/d" -e "/arcore_flutter_plus/d" -e "/carrier_info/d" -e "s/package:mindspark\//package:mindspark1\//g" -e "s/package:mind_spark\//package:mindspark1\//g" {} + 2>/dev/null || true
          flutter pub get --no-example || true
          dart format lib/ 2>/dev/null || true
          dart fix --apply 2>/dev/null || true

      - name: Build Android APK
        run: |
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Build Web
        run: |
          # Inject explicit placeholder matching rules into index file layout to satisfy tool rules
          grep -q '<base href=' web/index.html && sed -i 's|<base href="[^"]*">|<base href="\$FLUTTER_BASE_HREF">|g' web/index.html || sed -i '/<head>/a \  <base href="\$FLUTTER_BASE_HREF">' web/index.html
          
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
          
          # Bust browser caches instantly on device viewports
          sed -i "s/flutter_service_worker.js/flutter_service_worker.js?v=$(date +%s)/g" build/web/index.html 2>/dev/null || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Upload MindSpark APK
        uses: actions/upload-artifact@v4
        with:
          name: mindspark-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
