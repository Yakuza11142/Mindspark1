name: MindSpark Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mindspark-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Clean
        run: flutter clean

      - name: Get packages
        run: flutter pub get

      - name: Create secrets.json
        run: |
          cat > secrets.json <<EOF
          {
            "SUPABASE_URL":"${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY":"${{ secrets.SUPABASE_ANON_KEY }}",
            "GEMINI_API_KEY":"${{ secrets.GEMINI_API_KEY }}",
            "OPENAI_KEY":"${{ secrets.OPENAI_KEY }}",
            "GROQ_API_KEY":"${{ secrets.GROQ_API_KEY }}",
            "VERTEX_API_KEY":"${{ secrets.VERTEX_API_KEY }}",
            "HEYGEN_KEY":"${{ secrets.HEYGEN_KEY }}",
            "RUNWAYML_API_SECRET":"${{ secrets.RUNWAYML_API_SECRET }}",
            "TRIPO_API_KEY":"${{ secrets.TRIPO_API_KEY }}",
            "PEXELS_API_KEY":"${{ secrets.PEXELS_API_KEY }}",
            "MTN_API_KEY":"${{ secrets.MTN_API_KEY }}",
            "ELEVEN_LAB_API_KEY":"${{ secrets.ELEVEN_LAB_API_KEY }}"
          }
          EOF

      - name: Analyse
        run: flutter analyze

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build Web
        run: flutter build web --release --dart-define-from-file=secrets.json

      - name: Upload Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=secrets.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MindSpark-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4