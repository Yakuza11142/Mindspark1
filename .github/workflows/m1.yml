name: MindSpark Production CI
on:
  push: { branches: [main, master, dev, "**"] }
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: mindspark-production, cancel-in-progress: false }

jobs:
  build:
    name: Build MindSpark Android and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: { GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8", JAVA_TOOL_OPTIONS: "-Xmx4g" }
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java Runtime
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle }

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Setup Android Infrastructure
        uses: android-actions/setup-android@v3

      - name: Accept Developer Licenses
        run: yes | sdkmanager --licenses || true; sdkmanager --update || true

      - name: Factory Sandbox Setup
        run: |
          mkdir -p ../vault/lib ../vault/assets ../vault/web
          [ -d "lib" ] && cp -r lib/* ../vault/lib/ || true
          [ -d "assets" ] && cp -r assets/* ../vault/assets/ || true
          [ -d "web" ] && cp -r web/* ../vault/web/ || true
          
          rm -f pubspec.yaml pubspec.lock pubspec_overrides.yaml
          rm -rf android ios windows macos linux build
          
          # FIX: Create a standard non-hybrid legacy application blueprint to prevent build.gradle.kts mismatches
          flutter create --org com.mindspark --project-name mindspark1 --platforms=android,web .
          
          rm -rf lib assets web
          cp -r ../vault/lib ./lib
          cp -r ../vault/assets ./assets
          cp -r ../vault/web ./web
          
          cat << 'EOF' > pubspec.yaml
          name: mindspark1
          description: MindSpark Scalable 3D Vector Hologram Engine
          publish_to: "none"
          version: 1.0.0+1
          environment:
            sdk: ">=3.12.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            provider: any
            flutter_dotenv: any
            supabase_flutter: any
            google_mobile_ads: any
            flutter_jailbreak_detection: any
            flutter_secure_storage: any
            arcore_flutter_plus: any
          flutter:
            uses-material-design: true
            assets:
              - assets/
          EOF
          
          sed -i '/pqc/d' pubspec.yaml || true
          echo "dependency_overrides: {android_intent_plus: ^5.0.2, flutter_test: {sdk: flutter},flutter_driver: {sdk: flutter},integration_test: {sdk: flutter},sky_engine: {sdk: flutter}}" > pubspec_overrides.yaml

      - name: Native Toolchain Code Optimization
        run: |
          echo -e "analyzer:\n  exclude:\n    - 'build/**'\n  errors:\n    todo: ignore\nlinter:\n  rules: []" > analysis_options.yaml
          flutter pub get --no-example || true
          dart format lib/ || true
          dart fix --apply || true

      - name: Android Build Patching & Acceptable Framework Configuration
        shell: bash
        run: |
          # FIX: Delete modern KTS configuration duplicates if generated by the toolchain automatically
          rm -f android/app/build.gradle.kts android/build.gradle.kts
          
          rm -rf android/app/src/main/kotlin/com/mindspark/mindspark1/*
          mkdir -p android/app/src/main/kotlin/com/mindspark/mindspark1
          echo -e "package com.mindspark.mindspark1\nimport io.flutter.embedding.android.FlutterActivity\nclass MainActivity : FlutterActivity()" > android/app/src/main/kotlin/com/mindspark/mindspark1/MainActivity.kt
          
          # FIX: Align the settings to explicitly bypass internal AGP 9 layout evaluation checks
          echo -e "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\nandroid.enableJetifier=true\nandroid.newDsl=false\nandroid.builtInKotlin=false" > android/gradle.properties
          python3 -c "import json,os;secrets={k:os.environ.get(k,'').strip() for k in ['SUPABASE_URL','SUPABASE_ANON_KEY','GEMINI_API_KEY','OPENAI_KEY','GROQ_API_KEY','VERTEX_API_KEY','HEYGEN_KEY','RUNWAYML_API_SECRET','TRIPO_API_KEY','PEXELS_API_KEY','MTN_API_KEY','ELEVEN_LAB_API_KEY']};open('../secrets.json','w').write(json.dumps(secrets))"
          
          # Rebuild an optimized Groovy root-level controller script
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          # Force patch the downstream app-level layout manually to drop broken modern KTS dependencies
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace "com.mindspark.mindspark1"
              compileSdk 37
              defaultConfig {
                  applicationId "com.mindspark.mindspark1"
                  minSdk 24
                  targetSdk 37
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF
          
          # Purge bad internal configurations from problematic third party code elements
          find /home/runner/.pub-cache/hosted/pub.dev/arcore_flutter_plus-*/ -name "build.gradle" -exec sed -i '/configurations.all/,/}/d' {} + 2>/dev/null || true
          find /home/runner/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i '/def flutterRoot/,/}/d' {} + 2>/dev/null || true
          find /home/runner/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i '/variant.outputs.each/d' {} + 2>/dev/null || true
          
          # Universal dynamic normalization of toolchain targets
          find android/ /home/runner/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i -e 's/jcenter()/mavenCentral()/g' -e 's/google()/google(); mavenCentral()/g' -e 's/(compileSdk|targetSdk|compileSdkVersion|targetSdkVersion)\s+[0-9]*.*$/\1 37/g' {} + 2>/dev/null || true
          find android/ /home/runner/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i -e 's/buildToolsVersion\s\+["'\''][^"'\'']*["'\'']/buildToolsVersion "35.0.0"/g' {} + 2>/dev/null || true

          flutter pub get --no-example || true
        env: { SUPABASE_URL: "${{ secrets.SUPABASE_URL }}", SUPABASE_ANON_KEY: "${{ secrets.SUPABASE_ANON_KEY }}", GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}", OPENAI_KEY: "${{ secrets.OPENAI_KEY }}", GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}", VERTEX_API_KEY: "${{ secrets.VERTEX_API_KEY }}", HEYGEN_KEY: "${{ secrets.HEYGEN_KEY }}", RUNWAYML_API_SECRET: "${{ secrets.RUNWAYML_API_SECRET }}", TRIPO_API_KEY: "${{ secrets.TRIPO_API_KEY }}", PEXELS_API_KEY: "${{ secrets.PEXELS_API_KEY }}", MTN_API_KEY: "${{ secrets.MTN_API_KEY }}", ELEVEN_LAB_API_KEY: "${{ secrets.ELEVEN_LAB_API_KEY }}" }

      - name: Build Obfuscated Android APK
        run: |
          mkdir -p ../symbols
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=../symbols \
            --android-skip-build-dependency-validation \
            --dart-define-from-file=../secrets.json

      - name: Build Genuine Web Application & Auto-Heal Layout Architecture
        run: |
          rm -rf build/web web
          flutter create --platforms=web --org com.mindspark --project-name mindspark1 .
          sed -i 's|<base href="/">|<base href="/${{ github.event.repository.name }}/">|g' web/index.html || true
          flutter build web --release \
            --extra-front-end-options=--obfuscate \
            --dart-define-from-file=../secrets.json
          sed -i "s/flutter_service_worker.js/flutter_service_worker.js?v=\$(date +%s)/g" build/web/index.html 2>/dev/null || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Pack Production Assets
        uses: actions/upload-pages-artifact@v3
        with: { path: build/web }

      - name: Deploy Web App to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Upload Android Release APK Artifact
        uses: actions/upload-artifact@v4
        with: { name: mindspark-release-apk, path: build/app/outputs/flutter-apk/app-release.apk }

      - name: Upload Obfuscation Symbols
        uses: actions/upload-artifact@v4
        with: { name: mindspark-obfuscation-symbols, path: ../symbols/ }
