name: MindSpark Ultimate Production CI

on:
  push:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mindspark-production-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build MindSpark Android Fat APK + Web
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dfile.encoding=UTF-8
        -Dorg.gradle.warning.mode=none
        -Dorg.gradle.vfs.watch=false
      JAVA_TOOL_OPTIONS: "-Xmx4g"

      SIGNING_STORE_FILE: android/release.keystore
      SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Toolchain
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      - name: Clean Workspace & Remove Fallbacks
        run: |
          flutter clean || true
          rm -rf build/
          rm -rf .dart_tool/
          find . -type f \( -name "*.fallback" -o -name "*.bak" \) -delete

      - name: Resolve Dependencies
        run: |
          flutter pub get

      # ============================================================
      # ISOLATED ANDROID DIRECTORY RECREATION
      # ============================================================
      - name: Generate Fresh Android Directory Only
        run: |
          rm -rf android
          
          # Create temporary folder to avoid touching top-level pubspec.yaml
          mkdir -p _temp_android_gen
          cd _temp_android_gen
          flutter create --platforms=android --no-pub --org com.mindspark.app --project-name mindspark1 .
          cd ..

          # Move only the freshly generated android directory to project root
          mv _temp_android_gen/android ./android
          rm -rf _temp_android_gen

      - name: Apply Dart Fixes
        run: |
          dart fix --apply

      - name: Format Dart Code
        run: |
          dart format lib

      - name: Validate Flutter Project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          grep -q "void main" lib/main.dart

          echo "Flutter project validation successful."

      - name: Generate Production Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "{\"SUPABASE_URL\": \"${SUPABASE_URL}\", \"SUPABASE_ANON_KEY\": \"${SUPABASE_ANON_KEY}\"}" > secrets.json
          echo "secrets.json file created successfully."

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore

            test -s android/release.keystore

            echo "Release keystore prepared successfully."
          else
            echo "KEYSTORE_BASE64 is not configured."
            echo "Continuing with Flutter/Android default release signing."
          fi

      - name: Build Universal Fat Release APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --target=lib/main.dart \
            -Pdisable-abi-filtering=true \
            --dart-define-from-file=secrets.json

      - name: Build Flutter Web
        run: |
          flutter config --enable-web

          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          flutter build web \
            --release \
            --target=lib/main.dart \
            --base-href="/${REPO_NAME}/" \
            --dart-define-from-file=secrets.json

          test -f build/web/index.html

          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html

          echo "=========================================="
          echo "WEB BUILD SUCCESSFUL"
          echo "=========================================="

          du -sh build/web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Upload Universal Fat APK
        uses: actions/upload-artifact@v4
        with:
          name: mindspark-universalfat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup Generated Secrets
        if: always()
        run: |
          rm -f secrets.json
          rm -f android/release.keystore
          rm -f android/key.properties

  deploy:
    name: Deploy MindSpark Web to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
