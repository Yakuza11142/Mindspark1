name: MindSpark Production CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mindspark-production
  cancel-in-progress: true

jobs:
  build:
    name: Build MindSpark Android and Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
      JAVA_TOOL_OPTIONS: "-Xmx4g"

    steps:
      - name: Checkout MindSpark
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --update || true

      - name: Verify Project Structure & Check Pubspec Duplicate Keys
        run: |
          test -f pubspec.yaml
          test -d lib
          test -d android
          echo "Checking pubspec.yaml for duplicate mapping keys..."
          python3 -c '
          import yaml
          from collections import Counter
          def check_duplicates(loader, node):
              keys = [loader.construct_object(k) for k, v in node.value]
              counter = Counter(keys)
              duplicates = [k for k, count in counter.items() if count > 1]
              if duplicates:
                  print(f"ERROR: Duplicate keys found in pubspec.yaml: {duplicates}")
                  exit(1)
              return loader.construct_mapping(node)
          yaml.SafeLoader.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, check_duplicates)
          with open("pubspec.yaml") as f:
              yaml.safe_load(f)
          print("pubspec.yaml validation passed.")
          '

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Dart Format lib
        run: dart format lib/ || true

      - name: Dart Fix lib
        run: dart fix --apply || true

      - name: Configure Android
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/kotlin/com/mindspark/mindspark1

          cat > android/app/src/main/kotlin/com/mindspark/mindspark1/MainActivity.kt <<'EOF'
          package com.mindspark.mindspark1

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF

          if [ -f android/gradle.properties ]; then
            grep -q "^org.gradle.jvmargs=" android/gradle.properties || echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> android/gradle.properties
            grep -q "^android.useAndroidX=" android/gradle.properties || echo "android.useAndroidX=true" >> android/gradle.properties
            grep -q "^android.enableJetifier=" android/gradle.properties || echo "android.enableJetifier=true" >> android/gradle.properties
          else
            cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          fi

      - name: Build Android APK
        run: |
          flutter build apk --debug --android-skip-build-dependency-validation

      - name: Build Web
        run: |
          flutter build web \
            --release \
            --base-href "/${{ github.event.repository.name }}/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Upload MindSpark APK
        uses: actions/upload-artifact@v4
        with:
          name: mindspark-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
