<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mind Spark Production Engine.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MindSpark">

  <title>Application Engine</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; }
    html, body {
      background-color: #080A0F;
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    .ms-loading-container {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      background-color: #080A0F;
      position: absolute; top: 0; left: 0; z-index: 99999;
    }
    .ms-spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(0, 243, 255, 0.15);
      border-radius: 50%;
      border-top-color: #00F3FF;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-indicator" class="ms-loading-container">
    <div class="ms-spinner"></div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
