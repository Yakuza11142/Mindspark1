<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Flutter injects base-href here from command line arguments -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mind Spark Production Engine.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Mind Spark</title>

  <!-- Preload Cupertino / Material asset fonts -->
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="font" type="font/opentype" crossorigin>

  <style>
    @font-face {
      font-family: 'MaterialIcons';
      src: url('assets/fonts/MaterialIcons-Regular.otf') format('opentype');
    }
    * { box-sizing: border-box; }
    html, body {
      background-color: #080A0F;
      margin: 0; 
      padding: 0;
      width: 100vw; 
      height: 100vh;
      overflow: hidden;
    }
  </style>

  <script src="flutter_bootstrap.js" async></script>
</head>
<body>
</body>
</html>
