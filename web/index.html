<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Relative base href dynamically detects your repo path on GitHub Pages -->
  <script>
    document.write('<base href="' + document.location.pathname + '" />');
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mind Spark.">

  <!-- Mobile Viewport Setup -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="App Engine">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon Core Mapping -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Application Engine</title>
  <link rel="manifest" href="manifest.json">

  <!-- Minimal Loader Styling -->
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      background-color: #080A0F;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Native Flutter Loading Indicator */
    .ms-loading-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #080A0F;
      transition: opacity 0.4s ease-out;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 99999;
    }
    .ms-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 243, 255, 0.15);
      border-radius: 50%;
      border-top-color: #00F3FF;
      animation: spin 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Minimal Engine Loader -->
  <div id="loading-indicator" class="ms-loading-container">
    <div class="ms-spinner"></div>
  </div>

  <!-- Standard Event Listener for First Frame -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const indicator = document.getElementById('loading-indicator');
      if (indicator) {
        indicator.style.opacity = '0';
        setTimeout(() => indicator.remove(), 400);
      }
    });
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('flutter_service_worker.js')
        .catch(function(error) {
          console.error('ServiceWorker registration failed:', error);
        });
    }
  </script>

  <!-- Official Flutter Web Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
