<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The exact literal token the compiler needs to inject your repository path -->
  <base href="$FLUTTER_BASE_HREF">

  <script>
    // Fallback block: Prevents crashes during local device testing
    (function () {
      var baseTag = document.querySelector('base');
      if (baseTag && baseTag.getAttribute('href') === '$FLUTTER_BASE_HREF') {
        var path = window.location.pathname;
        if (!path.endsWith('/')) {
          path = path.substring(0, path.lastIndexOf('/') + 1);
        }
        baseTag.setAttribute('href', path);
      }
    }());
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mind Spark Production Engine.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MindSpark">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Application Engine</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      background-color: #080A0F;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .ms-loading-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #080A0F;
      transition: opacity 0.4s ease-out;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 99999;
    }
    .ms-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 243, 255, 0.15);
      border-radius: 50%;
      border-top-color: #00F3FF;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="loading-indicator" class="ms-loading-container">
    <div class="ms-spinner"></div>
  </div>

  <script>
    window.addEventListener('load', function() {
      // Modern Flutter Engine Bootstrapper Initialization
      _flutter = {
        loader: {
          didCreateEngineInitializer: function(engineInitializer) {
            engineInitializer.initializeEngine({
              useColorWithAlpha: true
            }).then(function(appRunner) {
              appRunner.runApp();
              setTimeout(function() {
                var indicator = document.getElementById('loading-indicator');
                if (indicator) {
                  indicator.style.opacity = '0';
                  setTimeout(function() { indicator.remove(); }, 400);
                }
              }, 200);
            });
          }
        }
      };

      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.type = 'text/javascript';
      script.async = true;
      document.body.appendChild(script);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=' + new Date().getTime())
          .catch(function(error) {
            console.error('ServiceWorker engine registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
