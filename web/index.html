<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mind Spark.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Application Engine</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #080A0F;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .loader {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      background: #080A0F;
      z-index: 99999;
      transition: opacity 0.4s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 243, 255, 0.15);
      border-radius: 50%;
      border-top-color: #00F3FF;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator" class="loader">
    <div class="spinner"></div>
  </div>

  <!-- Modern, Fail-safe Flutter Bootstrapper -->
  <script>
    window.addEventListener('load', function() {
      _flutter = {
        loader: {
          didCreateEngineInitializer: function(engineInitializer) {
            engineInitializer.initializeEngine({
              useColorWithAlpha: true
            }).then(function(appRunner) {
              appRunner.runApp();
              // Smoothly clear loader when engine transitions
              setTimeout(function() {
                var indicator = document.getElementById('loading-indicator');
                if (indicator) {
                  indicator.style.opacity = '0';
                  setTimeout(function() { indicator.remove(); }, 400);
                }
              }, 500);
            });
          }
        }
      };
      
      // Inject the base entry point dynamically after initialization rules map
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
