<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/Mindspark1/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mind Spark Production Engine.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Mind Spark</title>

  <!-- Material Icons Font CDN -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">

  <style>
    * { box-sizing: border-box; }
    html, body {
      background-color: #080A0F;
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }
    .ms-loading-container {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      background-color: #080A0F;
      position: absolute; top: 0; left: 0; z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .ms-spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(0, 243, 255, 0.15);
      border-radius: 50%;
      border-top-color: #00F3FF;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Official Flutter Web Bootstrapper -->
  <script src="flutter_bootstrap.js" async></script>
</head>
<body>

  <div id="loading-indicator" class="ms-loading-container">
    <div class="ms-spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var indicator = document.getElementById('loading-indicator');
      if (indicator) {
        indicator.style.opacity = '0';
        setTimeout(function() { indicator.remove(); }, 400);
      }
    });
  </script>
</body>
</html>
